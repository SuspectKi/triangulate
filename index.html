<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triangulate by SuspectKi</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #121212;
        color: #ffffff;
        font-family: 'Courier New', Courier, monospace;
        overflow: hidden;
    }

    .typing-container {
        font-size: 3rem;
        font-weight: 400;
        letter-spacing: 2px;
        white-space: nowrap;
        overflow: hidden;
        border-right: 4px solid #ffffff;
        width: 22ch;
        animation: typing 2s steps(22) infinite, blink 0.7s step-end infinite alternate;
        text-align: center;
    }

    @keyframes typing {
        0%, 20% {
            width: 0;
        }
        40%, 60% {
            width: 22ch;
        }
        80%, 100% {
            width: 0;
        }
    }

    @keyframes blink {
        50% {
            border-color: transparent;
        }
    }

    .byline {
        position: absolute;
        bottom: 30px;
        font-size: 1.2rem;
        color: rgba(255,255,255,0.6);
        font-family: 'Courier New', Courier, monospace;
        letter-spacing: 1px;
        text-align: center;
    }

    @media (max-width: 600px) {
        .typing-container {
            font-size: 2rem;
            width: 18ch;
        }
        .byline {
            font-size: 1rem;
        }
    }
</style>
</head>
<body>
    <div class="typing-container">Work in Progress...</div>
    <div class="byline">by SuspectKi</div>
</body>
</html>
