<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triangulate by SuspectKi</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #1a1a1a;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        color: #fff;
        overflow: hidden;
        flex-direction: column;
    }

    h1 {
        font-size: 4rem;
        color: rgba(255, 255, 255, 0.9);
        text-align: center;
        margin-bottom: 80px;
        font-weight: 300;
        letter-spacing: 2px;
    }

    .loader {
        width: 120px;
        height: 120px;
        position: relative;
        perspective: 1000px;
    }

    .triangle {
        width: 0;
        height: 0;
        border-left: 60px solid transparent;
        border-right: 60px solid transparent;
        border-bottom: 104px solid rgba(255, 255, 255, 0.8);
        position: absolute;
        top: 0;
        left: 0;
        transform-origin: 50% 66%;
        animation: rotate 2s linear infinite;
        filter: drop-shadow(0 0 20px rgba(255,255,255,0.4));
        border-radius: 6px; 
    }

    @keyframes rotate {
        0% {
            transform: rotate(0deg) scale(1);
        }
        50% {
            transform: rotate(180deg) scale(1.05);
        }
        100% {
            transform: rotate(360deg) scale(1);
        }
    }

    .triangle::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, rgba(255,255,255,0.3), rgba(255,255,255,0) 70%);
        border-radius: 6px;
        pointer-events: none;
    }
    @media (max-width: 600px) {
        h1 {
            font-size: 2rem;
            margin-bottom: 50px;
        }
        .loader {
            width: 80px;
            height: 80px;
        }
        .triangle {
            border-left: 40px solid transparent;
            border-right: 40px solid transparent;
            border-bottom: 69px solid rgba(255, 255, 255, 0.8);
        }
    }
</style>
</head>
<body>
    <h1>Work in Progress</h1>
    <div class="loader">
        <div class="triangle"></div>
    </div>
</body>
</html>
