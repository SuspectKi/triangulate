<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangulate by SuspectKi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #121212;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        h1 {
            font-size: 4rem;
            text-align: center;
            margin-bottom: 50px;
            color: #ff4081;
        }

        .triangle-loader {
            position: relative;
            width: 150px;
            height: 130px;
        }
        .triangle-loader .line {
            position: absolute;
            width: 0;
            height: 2px;
            background: red;
            transform-origin: left center;
            animation: draw 2s infinite;
        }

        .line1 {
            top: 0;
            left: 0;
            background: red;
            transform: rotate(60deg);
            animation-delay: 0s;
        }

        .line2 {
            bottom: 0;
            left: 0;
            background: green;
            transform: rotate(-60deg);
            animation-delay: 0.5s;
        }

        .line3 {
            bottom: 0;
            right: 0;
            background: purple;
            transform: rotate(180deg);
            animation-delay: 1s;
        }

        @keyframes draw {
            0% {
                width: 0;
            }
            50% {
                width: 100%;
            }
            100% {
                width: 0;
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2.5rem;
            }
            .triangle-loader {
                width: 100px;
                height: 90px;
            }
        }

        .triangle-loader .line {
            box-shadow: 0 0 10px currentColor;
        }
    </style>
</head>
<body>
    <h1>Work in Progress</h1>
    <div class="triangle-loader">
        <div class="line line1"></div>
        <div class="line line2"></div>
        <div class="line line3"></div>
    </div>
</body>
</html>
