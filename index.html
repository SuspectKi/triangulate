<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triangulate 1.21.8</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #121212;
        color: #ffffff;
        font-family: 'Courier New', Courier, monospace;
        overflow: hidden;
    }

    .typing-container {
        font-size: 7rem;
        font-weight: semi-bold;
        letter-spacing: 2px;
        white-space: nowrap;
        overflow: hidden;
        border-right: 4px solid #ffffff;
        width: 26ch;
        text-align: center;
        animation: typing 5s steps(26) infinite, blink 0.9s step-end infinite alternate;
    }

    @keyframes typing {
        0%, 10% { width: 0; }
        60% { width: 26ch; }
        70%, 100% { width: 0; }
    }

    @keyframes blink {
        50% { border-color: transparent; }
    }

    .byline {
        position: absolute;
        bottom: 30px;
        font-size: 1.5rem;
        color: rgba(255,255,255,0.6);
        font-family: 'Courier New', Courier, monospace;
        letter-spacing: 1px;
        text-align: center;
    }

    @media (max-width: 600px) {
        .typing-container {
            font-size: 3rem;
            width: 22ch;
        }
        .byline {
            font-size: 1rem;
        }
    }
</style>
</head>
<body>
    <div class="typing-container">Work in Progress...</div>
    <div class="byline">by SuspectKi</div>
</body>
</html>
