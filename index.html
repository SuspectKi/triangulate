<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Triangulate. Minecraft triangulation tool."
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <meta
        name="theme-color"
        content="#121212"
    >

    <meta
        name="referrer"
        content="strict-origin-when-cross-origin"
    >

    <title>Triangulate</title>

    <link
        rel="icon"
        type="image/svg+xml"
        href="assets/favicon.svg"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --background: #121212;
            --text: #ffffff;
            --muted: rgba(255, 255, 255, 0.55);
        }

        html {
            background: var(--background);
        }

        body {
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            background: var(--background);
            color: var(--text);

            font-family:
                "Courier New",
                Courier,
                monospace;

            overflow: hidden;
        }
        main {
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .typing-container {
            display: inline-flex;
            align-items: center;

            font-size: 7rem;
            font-weight: 600;
            letter-spacing: 2px;
            line-height: 1.1;

            white-space: nowrap;

            text-shadow:
                0 0 8px rgba(255, 255, 255, 0.08);
        }

        #typing-text {
            display: inline-block;
        }

        .cursor {
            display: inline-block;

            width: 4px;
            height: 0.95em;

            margin-left: 5px;

            background: var(--text);

            animation: cursor-blink 0.8s step-end infinite;
        }

        @keyframes cursor-blink {
            0%,
            45% {
                opacity: 1;
            }

            50%,
            100% {
                opacity: 0;
            }
        }

        .byline {
            position: fixed;
            bottom: 30px;

            font-size: 1.5rem;
            letter-spacing: 1px;

            color: var(--muted);

            text-align: center;

            transition:
                color 0.25s ease;
        }

        .byline:hover {
            color: var(--text);
        }

        @media (max-width: 700px) {
            .typing-container {
                font-size: 3rem;
                letter-spacing: 1px;
            }

            .cursor {
                width: 3px;
                margin-left: 4px;
            }

            .byline {
                bottom: 24px;
                font-size: 1rem;
            }
        }

        @media (max-width: 400px) {
            .typing-container {
                font-size: 2.25rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .cursor {
                animation: none;
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <main>
        <div
            class="typing-container"
            aria-label="Work in Progress"
        >
            <span id="typing-text"></span>
            <span
                class="cursor"
                aria-hidden="true"
            ></span>
        </div>
    </main>

    <div class="byline">
        by SuspectKi
    </div>

    <script>
        const text = "Work in Progress...";
        const element = document.getElementById("typing-text");

        let index = 0;
        let deleting = false;
        function randomDelay(min, max) {
            return Math.floor(
                Math.random() * (max - min + 1)
            ) + min;
        }

        function typewriter() {

            if (!deleting) {
                element.textContent =
                    text.substring(0, index + 1);

                index++;

                if (index === text.length) {
                    setTimeout(() => {
                        deleting = true;
                        typewriter();
                    }, 1800);

                    return;
                }

                setTimeout(
                    typewriter,
                    randomDelay(45, 95)
                );

            } else {
                element.textContent =
                    text.substring(0, index - 1);

                index--;
                if (index === 0) {

                    deleting = false;
                    setTimeout(
                        typewriter,
                        550
                    );

                    return;
                }

                setTimeout(
                    typewriter,
                    randomDelay(30, 70)
                );
            }
        }
        setTimeout(typewriter, 500);
    </script>

</body>
</html>
